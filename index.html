      if (swingRef.current) swingRef.current.style.transform = 'rotate(0rad)';
      if (ropeRef.current) ropeRef.current.style.transform = 'scaleY(1)';
      if (lowerRef.current) lowerRef.current.style.transform = 'translateY(0px)';
      if (shadowRef.current) {
        shadowRef.current.style.transform = 'translateX(-50%) scaleX(1)';
        shadowRef.current.style.opacity = '0.85';
      }
    };

    const tick = (t) => {
      const dt = clampNum((t - last) / 1000, 0.001, 0.033); last = t;
      if (!S.dragging) {
        S.omega += (-K * Math.sin(S.theta) - DAMP * S.omega) * dt;
        S.theta += S.omega * dt;
        const M = maxAngRef.current;
        if (S.theta > M) {
          S.theta = M;
          if (S.omega > 0) { S.omega = -S.omega * REST; S.stretchV += Math.min(4.5, Math.abs(S.omega) * WHIP + 0.5); }
        } else if (S.theta < -M) {
          S.theta = -M;
          if (S.omega < 0) { S.omega = -S.omega * REST; S.stretchV += Math.min(4.5, Math.abs(S.omega) * WHIP + 0.5); }
        }
        const cf = Math.min(0.35, S.omega * S.omega * CF);
        S.stretchV += (-(S.stretch - (1 + cf)) * K_S - C_S * S.stretchV) * dt;
        S.stretch += S.stretchV * dt;
        if (S.stretch > 1.75) { S.stretch = 1.75; if (S.stretchV > 0) S.stretchV = -S.stretchV * 0.55; }
        if (S.stretch < 0.75) { S.stretch = 0.75; if (S.stretchV < 0) S.stretchV = -S.stretchV * 0.55; }

        if (Math.abs(S.omega) < 0.005 && Math.abs(S.theta) < 0.004 &&
            Math.abs(S.stretchV) < 0.004 && Math.abs(S.stretch - 1) < 0.004) {
          writeRest();
          settledRef.current = true;
          raf = 0;
          return;
        }
      }
      writeFrame();
      raf = requestAnimationFrame(tick);
    };

    const start = () => {
      if (raf) return;
      settledRef.current = false;
      last = performance.now();
      raf = requestAnimationFrame(tick);
    };
    const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
    wakeRef.current = start;

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        visibleRef.current = e.isIntersecting;
        if (stageRef.current) stageRef.current.classList.toggle('idcl-off', !e.isIntersecting);
        if (e.isIntersecting) { if (!settledRef.current) start(); }
        else stop();
      });
    }, { rootMargin: '120px' });
    if (stageRef.current) io.observe(stageRef.current);

    const onVis = () => {
      if (document.hidden) stop();
      else if (visibleRef.current && !settledRef.current) start();
    };
    document.addEventListener('visibilitychange', onVis);

    return () => {
      stop();
      io.disconnect();
      document.removeEventListener('visibilitychange', onVis);
      wakeRef.current = () => {};
    };
  }, []);

  const refreshRect = () => {
    rectCacheRef.current = cardRef.current ? cardRef.current.getBoundingClientRect() : null;
    return rectCacheRef.current;
  };

  const applyTilt = () => {
    tiltRafRef.current = 0;
    const t = tiltTargetRef.current;
    if (!t || !cardRef.current) return;
    cardRef.current.style.setProperty('--mx', t.mx + '%');
    cardRef.current.style.setProperty('--my', t.my + '%');
    if (tiltRef.current) {
      tiltRef.current.style.transition = 'none';
      tiltRef.current.style.transform = 'rotateX(' + t.rx + 'deg) rotateY(' + t.ry + 'deg)';
    }
  };

  const onCardHover = (e) => {
    if (S.dragging) return;
    const r = (!settledRef.current || !rectCacheRef.current) ? refreshRect() : rectCacheRef.current;
    if (!r || r.width < 2) return;
    tiltTargetRef.current = {
      mx: (((e.clientX - r.left) / r.width) * 100).toFixed(1),
      my: (((e.clientY - r.top) / r.height) * 100).toFixed(1),
      rx: ((((e.clientY - r.top) / r.height) - 0.5) * -7).toFixed(2),
      ry: ((((e.clientX - r.left) / r.width) - 0.5) * 9).toFixed(2)
    };
    if (!tiltRafRef.current) tiltRafRef.current = requestAnimationFrame(applyTilt);
  };

  const onCardHoverEnd = () => {
    if (S.dragging) return;
    if (tiltRafRef.current) { cancelAnimationFrame(tiltRafRef.current); tiltRafRef.current = 0; }
    if (tiltRef.current) {
      tiltRef.current.style.transition = 'transform .45s ease';
      tiltRef.current.style.transform = 'rotateX(0deg) rotateY(0deg)';
    }
  };

  const getPoint = (e) => (e.touches && e.touches[0]) ? e.touches[0] : e;
  const pivotOf = () => {
    const sr = stageRef.current ? stageRef.current.getBoundingClientRect() : null;
    return { px: sr ? sr.left + sr.width / 2 : window.innerWidth / 2, py: sr ? sr.top + 3 : 0 };
  };

  const startDrag = (e) => {
    if (S.dragging) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    const p = getPoint(e);
    S.dragging = true; S.moved = 0;
    S.lastX = p.clientX; S.lastY = p.clientY; S.lastT = performance.now();
    S.samples.length = 0;
    let pivot = pivotOf();
    const refreshPivot = () => { pivot = pivotOf(); };
    window.addEventListener('scroll', refreshPivot, { passive: true });
    S.grabDist = Math.max(80, Math.hypot(p.clientX - pivot.px, p.clientY - pivot.py));
    setDragging(true);
    if (tiltRef.current) {
      tiltRef.current.style.transition = 'none';
      tiltRef.current.style.transform = 'rotateX(0deg) rotateY(0deg)';
    }
    document.body.style.cursor = 'grabbing';
    wakeRef.current();
    sheenTRef.current = 0;

    const onMove = (ev) => {
      if (ev.cancelable) ev.preventDefault();
      const pt = getPoint(ev);
      const nowMs = performance.now();
      if (nowMs - sheenTRef.current > 100) {
        sheenTRef.current = nowMs;
        const r = rectCacheRef.current || refreshRect();
        const card = cardRef.current;
        if (r && card && r.width > 2) {
          card.style.setProperty('--mx', (((pt.clientX - r.left) / r.width) * 100).toFixed(1) + '%');
          card.style.setProperty('--my', (((pt.clientY - r.top) / r.height) * 100).toFixed(1) + '%');
        }
      }
      const dx = pt.clientX - pivot.px;
      const dy = pt.clientY - pivot.py;
      const target = clampNum(-Math.atan2(dx, dy), -MAX_DRAG, MAX_DRAG);
      const now = performance.now();
      const dt = Math.max((now - S.lastT) / 1000, 0.008);
      const prev = S.theta;
      S.theta += (target - S.theta) * 0.9;
      S.samples.push((S.theta - prev) / dt);
      if (S.samples.length > 6) S.samples.shift();
      const dist = Math.hypot(dx, dy);
      const desired = clampNum(dist / Math.max(S.grabDist, 60), 0.85, 1.65);
      S.stretch += (desired - S.stretch) * 0.5;
      S.moved += Math.abs(pt.clientX - S.lastX) + Math.abs(pt.clientY - S.lastY);
      S.lastX = pt.clientX; S.lastY = pt.clientY; S.lastT = now;
    };

    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
      window.removeEventListener('touchcancel', onUp);
      window.removeEventListener('scroll', refreshPivot);
      S.dragging = false;
      setDragging(false);
      if (tiltRef.current) {
        tiltRef.current.style.transition = 'transform .45s ease';
        tiltRef.current.style.transform = 'rotateX(0deg) rotateY(0deg)';
      }
      document.body.style.cursor = '';
      rectCacheRef.current = null;
      if (S.samples.length) {
        const avg = S.samples.reduce((a, b) => a + b, 0) / S.samples.length;
        S.omega = clampNum(avg * 1.1, -13, 13);
      }
      S.stretchV = clampNum((S.stretch - 1) * 7 + Math.abs(S.omega) * 0.22, -6.5, 6.5);
      maxAngRef.current = clampNum(Math.max(baseMaxRef.current, Math.abs(S.theta) + 0.08), baseMaxRef.current, 2.55);
      if (S.moved < 8) { setFlipped(f => !f); S.omega = 0; }
      setInteracted(true);
    };

    if (window.PointerEvent) {
      window.addEventListener('pointermove', onMove, { passive: false });
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    } else {
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onUp);
      window.addEventListener('touchcancel', onUp);
    }
  };

  const qrCells = useMemo(() => {
    const rnd = seededRand(20240713);
    const finder = (lr, lc) => !(lr === 1 && lc === 1);
    const cells = [];
    for (let i = 0; i < 81; i++) {
      const r = Math.floor(i / 9), c = i % 9;
      let on;
      if (r < 3 && c < 3) on = finder(r, c);
      else if (r < 3 && c > 5) on = finder(r, c - 6);
      else if (r > 5 && c < 3) on = finder(r - 6, c);
      else on = rnd() > 0.52;
      cells.push(on);
    }
    return cells;
  }, []);

  const bars = useMemo(() => {
    const rnd = seededRand(7331);
    return Array.from({ length: 24 }, () => ({ w: rnd() > 0.72 ? 3 : (rnd() > 0.4 ? 2 : 1), h: 50 + Math.round(rnd() * 50) }));
  }, []);

  return html`
    <div class="idcl-root" style="width:100%">
      <div class="idcl-stage" ref=${stageRef} style=${'height:' + dims.stageH + 'px'}>
        <div class="idcl-rail"></div>
        <div class="idcl-swing" ref=${swingRef} style=${'--rope:' + dims.rope + 'px'}>
          <div class="idcl-rope-line" ref=${ropeRef}></div>
          <div class="idcl-lower" ref=${lowerRef}>
            <div class="idcl-clasp"></div>
            <div ref=${cardRef} class=${'idcl-card' + (dragging ? ' idcl-dragging' : '')}
              role="button" tabIndex="0"
              aria-label="Kartu ID: tarik untuk mengayun & memantul, klik untuk membalik"
              onPointerEnter=${refreshRect}
              onPointerDown=${startDrag}
              onMouseDown=${(e) => { if (!window.PointerEvent) startDrag(e); }}
              onTouchStart=${(e) => { if (!window.PointerEvent) startDrag(e); }}
              onPointerMove=${onCardHover}
              onPointerLeave=${onCardHoverEnd}
              onDragStart=${(e) => e.preventDefault()}
              onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFlipped(f => !f); setInteracted(true); } }}>
              <div class="idcl-tilt" ref=${tiltRef}>
                <div class="idcl-flipper" style=${'transform:rotateY(' + (flipped ? 180 : 0) + 'deg)'}>
                  <div class="idcl-face idcl-front">
                    <div class="idcl-holo"></div>
                    <div class="idcl-hole"></div>
                    <div class="idcl-header">
                      <div class="idcl-brand">
                        <${Sparkles} class="idcl-brand-mark" />
                        <div class="idcl-brand-text">
                          <b>${brand}</b>
                          <small>${brandTagline}</small>
                        </div>
                      </div>
                      <div class="idcl-pillars">
                        ${pillars.map(p => html`<span key=${p}>${p}</span>`)}
                        <i></i>
                      </div>
                    </div>
                    <div class="idcl-photo">
                      <img src=${photo} alt=${'Foto ' + name} loading="lazy" decoding="async" />
                    </div>
                    <div class="idcl-namerow">
                      <h3 class="idcl-name">${name}</h3>
                      <span class="idcl-verified" role="img" aria-label="Terverifikasi">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                      </span>
                    </div>
                    <p class="idcl-role">${role}</p>
                    <div class="idcl-divider"></div>
                    <div class="idcl-idrow">
                      <div class="idcl-idrow-labels">
                        <div><span>ID</span><b>${idNumber}</b></div>
                        <div><span>LOC</span><b>${location}</b></div>
                        <div><span>VALID</span><b>${validThru}</b></div>
                      </div>
                      <div class="idcl-stamp">SR</div>
                    </div>
                    <div class="idcl-footer">DESIGN <i>•</i> CODE <i>•</i> CONTENT</div>
                  </div>
                  <div class="idcl-face idcl-back">
                    <div class="idcl-hole"></div>
                    <div class="idcl-stripe"></div>
                    <div class="idcl-barcode" aria-hidden="true">
                      ${bars.map((b, i) => html`<span key=${i} style=${'width:' + b.w + 'px;height:' + b.h + '%'}></span>`)}
                    </div>
                    <p class="idcl-idnum"><span>NO. ${idNumber}</span><em>EXP ${validThru}</em></p>
                    <div class="idcl-backrow">
                      <div class="idcl-qr" aria-hidden="true">
                        ${qrCells.map((on, i) => html`<i key=${i} class=${on ? 'on' : ''}></i>`)}
                      </div>
                      <div class="idcl-scan"><b>SCAN / KONTAK</b>${site}</div>
                    </div>
                    <div class="idcl-connect">
                      <span>CONNECT</span>
                      <div class="idcl-connect-icons">
                        <a href=${githubUrl} target="_blank" rel="noopener noreferrer" aria-label="GitHub"><${Github} class="ic-s"/></a>
                        <a href=${linkedinUrl} target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><${Linkedin} class="ic-s"/></a>
                        <a href=${instagramUrl} target="_blank" rel="noopener noreferrer" aria-label="Instagram"><${Instagram} class="ic-s"/></a>
                      </div>
                    </div>
                    <div class="idcl-signrow">
                      <div>
                        <div class="idcl-sign">${name}</div>
                        <div class="idcl-signlabel">CARDHOLDER SIGNATURE</div>
                      </div>
                      <div class="idcl-signlabel">IF FOUND — ${location.toUpperCase()}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="idcl-shadow" ref=${shadowRef}></div>
        <div class=${'idcl-hint' + (interacted ? ' idcl-hidden' : '')}>
          <${ChevronLeft} class="ic-s"/> TARIK · KLIK UNTUK BALIK <${ChevronRight} class="ic-s"/>
        </div>
      </div>
    </div>`;
}

/* =========================================================
   ANIMATED LETTER TEXT — berlian biru tema
   ========================================================= */
const SCALLOP_PATH = 'M50 0 C55 15, 65 15, 75 10 C70 25, 75 35, 90 35 C80 45, 80 55, 90 65 C75 65, 70 75, 75 90 C65 85, 55 85, 50 100 C45 85, 35 85, 25 90 C30 75, 25 65, 10 65 C20 55, 20 45, 10 35 C25 35, 30 25, 25 10 C35 15, 45 15, 50 0Z';

function accentRGB() {
  try {
    const c = document.createElement('canvas').getContext('2d');
    if (!c) return [0, 113, 227];
    c.fillStyle = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '').trim() || '#0071e3';
    c.fillRect(0, 0, 1, 1);
    return Array.from(c.getImageData(0, 0, 1, 1).data.slice(0, 3));
  } catch (e) {
    return [0, 113, 227];
  }
}

function AnimatedLetterText({ text = 'Portofolio', letter = 'o', idSuffix = 'a' }) {
  const uid = idSuffix;
  const [rgb, setRgb] = useState(null);

  useEffect(() => {
    const update = () => setRgb(accentRGB());
    update();
    const obs = new MutationObserver(update);
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    return () => obs.disconnect();
  }, []);

  const lowerText = (text || '').toLowerCase();
  const idx = lowerText.indexOf((letter || 'o').toLowerCase());
  if (idx === -1) {
    return html`<span class="alt">${text}</span>`;
  }
  const before = text.slice(0, idx);
  const after = text.slice(idx + 1);
  const rgbSafe = rgb || [0, 113, 227];
  const r = rgbSafe[0], g = rgbSafe[1], b = rgbSafe[2];

  return html`
    <span class="alt">
      <span class="sr-only">${text}</span>
      <span aria-hidden="true" style="display:contents">
        ${before && html`<span key="b">${before}</span>`}
        <span class="alt-visual">
          <svg style="position:absolute;width:0;height:0" aria-hidden="true">
            <defs>
              <filter id=${'innerShadow-' + uid} x="-50%" y="-50%" width="200%" height="200%">
                <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0" /></feComponentTransfer>
                <feGaussianBlur stdDeviation="3" />
                <feOffset dx="0" dy="2" result="offsetblur" />
                <feFlood flood-color="rgba(255,255,255,0.15)" result="color" />
                <feComposite in2="offsetblur" operator="in" />
                <feComposite in2="SourceAlpha" operator="in" />
                <feMerge><feMergeNode in="SourceGraphic" /><feMergeNode /></feMerge>
              </filter>
              <filter id=${'diamondGlow-' + uid} x="-150%" y="-150%" width="400%" height="400%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
                <feFlood flood-color=${'rgba(' + r + ',' + g + ',' + b + ',0.35)'} />
                <feComposite in2="blur" operator="in" />
                <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
              <linearGradient id=${'diamondGradient-' + uid} x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color=${'rgba(' + Math.min(255, r + 45) + ',' + Math.min(255, g + 45) + ',' + Math.min(255, b + 45) + ',1)'} />
                <stop offset="40%" stop-color=${'rgba(' + r + ',' + g + ',' + b + ',1)'} />
                <stop offset="60%" stop-color=${'rgba(' + Math.max(0, r - 18) + ',' + Math.max(0, g - 18) + ',' + Math.max(0, b - 18) + ',1)'} />
                <stop offset="100%" stop-color=${'rgba(' + Math.max(0, r - 38) + ',' + Math.max(0, g - 38) + ',' + Math.max(0, b - 38) + ',1)'} />
              </linearGradient>
              <linearGradient id=${'diamondShine-' + uid} x1="0%" y1="0%" x2="50%" y2="50%">
                <stop offset="0%" stop-color="rgba(255,255,255,0.6)" />
                <stop offset="100%" stop-color="rgba(255,255,255,0)" />
              </linearGradient>
              <radialGradient id=${'outerShapeGradient-' + uid} cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#2a2a2a" />
                <stop offset="100%" stop-color="#0f0f0f" />
              </radialGradient>
            </defs>
          </svg>

          <svg viewBox="0 0 100 100" class="alt-outer">
            <path d=${SCALLOP_PATH} fill=${'url(#outerShapeGradient-' + uid + ')'} filter=${'url(#innerShadow-' + uid + ')'} />
            <path d=${SCALLOP_PATH} fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          </svg>

          <span class="alt-dwrap">
            <svg viewBox="0 0 100 100" class="alt-diamond" filter=${'url(#diamondGlow-' + uid + ')'}>
              <path d="M50 8 L92 50 L50 92 L8 50 Z" fill=${'url(#diamondGradient-' + uid + ')'} />
              <path d="M50 8 L8 50 L50 50 Z" fill=${'url(#diamondShine-' + uid + ')'} />
              <path d="M50 18 L82 50 L50 82 L18 50 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
            </svg>
          </span>
        </span>
        ${after && html`<span key="a">${after}</span>`}
      </span>
    </span>`;
}

/* =========================================================
   GRAVITY STARS — terjemahan gravity-stars.tsx
   Bintang dengan sumur gravitasi ke kursor: jatuh, berputar
   (swirl), terlempar keluar membawa momentum. Glow sprite
   per tint, garis konstelasi via spatial grid, twinkle,
   palet di-resolve dari token tema, Lehmer PRNG deterministik.
   ========================================================= */
const GS = {
  MAX_DPR: 2, TAU: Math.PI * 2,
  MAX_COUNT: 600, MIN_COUNT: 8, SMALL_W: 640, SMALL_RATIO: 0.6,
  STAR_SIZE: 1.5, GRAVITY: 1, DRAG: 0.03,
  CONNECT_DIST: 130, TWINKLE: 0.55, GLOW: 5.5, SPEED: 1, TINT: 0.5,
  TINT_COOL: 'oklch(0.92 0.028 255)', TINT_WARM: 'oklch(0.92 0.055 75)',
  FB_BASE: [232, 233, 238], FB_COOL: [221, 233, 247], FB_WARM: [243, 226, 194],
  P_RANGE: 260, P_ACCEL: 4000000, SOFT_SQ: 676, MAX_ACCEL: 5000, MAX_SPEED: 1200,
  SWIRL: 0.85, DRIFT: 12,
  MAX_DELTA: 0.05, REF_FPS: 60, MIN_CELL: 24, MAX_LINKS: 8,
  DEPTH_BIAS: 1.7, N_SIZE: 1.9, F_SIZE: 0.42, N_ALPHA: 0.82, F_ALPHA: 0.18,
  N_HALO: 0.7, F_HALO: 0.6, N_REACH: 0.8, F_REACH: 0.6, N_PULL: 1, F_PULL: 0.35, MIN_VIS: 0.01,
  L_LEVELS: 6, L_BASE: 0.3, L_MINW: 0.3, L_WSTEP: 0.12, L_CURVE: 1.5, L_DF: 0.25, L_DG: 0.75,
  TW_RATE: 1.15, TW_SPREAD: 0.8, TW_DEPTH: 0.5, SIZE_JIT: 0.5,
  SPRITE: 128, LEVELS: 5, SEED: 987654321, LEH_M: 16807, LEH_MOD: 2147483647,
  FWD: [1, 0, -1, 1, 0, 1, 1, 1]
};

function gsResolveColors(inputs, host) {
  try {
    const probe = document.createElement('span');
    probe.style.display = 'none';
    host.appendChild(probe);
    const canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const fb = [GS.FB_BASE, GS.FB_COOL, GS.FB_WARM];
    const out = inputs.map((input, i) => {
      if (!ctx) return fb[i];
      probe.style.color = '';
      probe.style.color = input.trim().startsWith('--') ? 'var(' + input.trim() + ')' : input.trim();
      const computed = window.getComputedStyle(probe).color;
      if (!computed) return fb[i];
      ctx.clearRect(0, 0, 1, 1);
      ctx.fillStyle = '#000';
      ctx.fillStyle = computed;
      ctx.fillRect(0, 0, 1, 1);
      const d = ctx.getImageData(0, 0, 1, 1).data;
      return [d[0], d[1], d[2]];
    });
    probe.remove();
    return out;
  } catch (e) {
    return [GS.FB_BASE, GS.FB_COOL, GS.FB_WARM];
  }
}

function gsPaintSprite(sprite, color) {
  const ctx = sprite.getContext('2d');
  if (!ctx) return;
  const [r, g, b] = color;
  const c = GS.SPRITE / 2;
  ctx.clearRect(0, 0, GS.SPRITE, GS.SPRITE);
  const grad = ctx.createRadialGradient(c, c, 0, c, c, c);
  grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
  grad.addColorStop(0.06, 'rgba(' + r + ',' + g + ',' + b + ',0.95)');
  grad.addColorStop(0.14, 'rgba(' + r + ',' + g + ',' + b + ',0.5)');
  grad.addColorStop(0.28, 'rgba(' + r + ',' + g + ',' + b + ',0.16)');
  grad.addColorStop(0.55, 'rgba(' + r + ',' + g + ',' + b + ',0.04)');
  grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, GS.SPRITE, GS.SPRITE);
}

function gsPaintSprites(sprites, pal, tint) {
  const last = Math.max(sprites.length - 1, 1);
  for (let lv = 0; lv < sprites.length; lv++) {
    const ramp = lv / last;
    const col = [0, 1, 2].map(k =>
      Math.round(
        (pal.base[k] + ((pal.cool[k] + (pal.warm[k] - pal.cool[k]) * ramp) - pal.base[k]) * tint)
      )
    );
    gsPaintSprite(sprites[lv], col);
  }
}

function createStarController(canvas) {
  let ctx = null;
  try { ctx = canvas.getContext('2d'); } catch (e) {}
  if (!ctx) return null;

  const sprites = [];
  for (let i = 0; i < GS.LEVELS; i++) {
    const sp = document.createElement('canvas');
    sp.width = GS.SPRITE; sp.height = GS.SPRITE;
    sprites.push(sp);
  }

  const N = GS.MAX_COUNT;
  const posX = new Float32Array(N), posY = new Float32Array(N);
  const velX = new Float32Array(N), velY = new Float32Array(N);
  const driftX = new Float32Array(N), driftY = new Float32Array(N);
  const depth = new Float32Array(N), phase = new Float32Array(N);
  const rate = new Float32Array(N), jitter = new Float32Array(N);
  const seedX = new Float32Array(N), seedY = new Float32Array(N);
  const tintLevel = new Uint8Array(N);

  /* Lehmer PRNG deterministik — tata letak identik setiap render */
  let st = GS.SEED % GS.LEH_MOD || 1;
  const rnd = () => { st = (st * GS.LEH_M) % GS.LEH_MOD; return st / GS.LEH_MOD; };
  for (let i = 0; i < N; i++) {
    seedX[i] = rnd(); seedY[i] = rnd();
    const z = Math.pow(rnd(), GS.DEPTH_BIAS);
    depth[i] = z;
    phase[i] = rnd() * GS.TAU;
    rate[i] = GS.TW_RATE * (1 + (rnd() - 0.5) * GS.TW_SPREAD);
    jitter[i] = 1 + (rnd() - 0.5) * GS.SIZE_JIT;
    const hue = (rnd() + rnd()) / 2;
    tintLevel[i] = Math.min(GS.LEVELS - 1, Math.floor(hue * GS.LEVELS));
    const ang = rnd() * GS.TAU;
    const mag = GS.DRIFT * (0.15 + z);
    driftX[i] = Math.cos(ang) * mag;
    driftY[i] = Math.sin(ang) * mag;
  }

  const maxSeg = N * GS.MAX_LINKS;
  const segments = new Float32Array(maxSeg * 4);
  const segLevel = new Uint8Array(maxSeg);
  let cellStart = new Int32Array(1), cellCursor = new Int32Array(1), cellItems = new Int32Array(N);

  const startedAt = performance.now();
  let S = {
    connect: true, connectDistance: GS.CONNECT_DIST, count: 220, drag: GS.DRAG,
    glow: GS.GLOW, gravity: GS.GRAVITY,
    palette: { base: GS.FB_BASE, cool: GS.FB_COOL, warm: GS.FB_WARM },
    speed: GS.SPEED, starSize: GS.STAR_SIZE, still: false, tint: GS.TINT, twinkle: GS.TWINKLE
  };
  gsPaintSprites(sprites, S.palette, S.tint);

  let width = 1, height = 1, active = 0, seeded = false;
  let pX = 0, pY = 0, pActive = false;
  let lastAt = startedAt, frame = 0, running = false, destroyed = false;

  const effCount = () => {
    const base = Math.max(GS.MIN_COUNT, Math.min(GS.MAX_COUNT, Math.round(S.count)));
    return width < GS.SMALL_W ? Math.max(GS.MIN_COUNT, Math.round(base * GS.SMALL_RATIO)) : base;
  };
  const seedPos = (n) => {
    for (let i = 0; i < n; i++) {
      posX[i] = seedX[i] * width; posY[i] = seedY[i] * height;
      velX[i] = 0; velY[i] = 0;
    }
    active = n; seeded = true;
  };
  const resize = () => {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, GS.MAX_DPR);
    const pw = width, ph = height;
    width = Math.max(1, rect.width);
    height = Math.max(1, rect.height);
    const px = Math.max(1, Math.round(width * dpr));
    const py = Math.max(1, Math.round(height * dpr));
    if (canvas.width !== px || canvas.height !== py) { canvas.width = px; canvas.height = py; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const next = effCount();
    if (!seeded || next !== active) { seedPos(next); return; }
    const sx = width / pw, sy = height / ph;
    for (let i = 0; i < active; i++) { posX[i] *= sx; posY[i] *= sy; }
  };

  const gridGeom = () => {
    const cell = Math.max(S.connectDistance, GS.MIN_CELL);
    return { cell, cols: Math.max(1, Math.ceil(width / cell)), rows: Math.max(1, Math.ceil(height / cell)) };
  };
  const sortGrid = (cell, cols, rows) => {
    const total = cols * rows;
    if (cellStart.length < total + 1) {
      cellStart = new Int32Array(total + 1);
      cellCursor = new Int32Array(total + 1);
    }
    cellStart.fill(0, 0, total + 1);
    if (cellItems.length < active) cellItems = new Int32Array(active);
    for (let i = 0; i < active; i++) {
      const c = Math.max(0, Math.min(cols - 1, Math.floor(posX[i] / cell)));
      const r = Math.max(0, Math.min(rows - 1, Math.floor(posY[i] / cell)));
      cellStart[r * cols + c + 1]++;
    }
    for (let c = 0; c < total; c++) { cellStart[c + 1] += cellStart[c]; cellCursor[c] = cellStart[c]; }
    for (let i = 0; i < active; i++) {
      const c = Math.max(0, Math.min(cols - 1, Math.floor(posX[i] / cell)));
      const r = Math.max(0, Math.min(rows - 1, Math.floor(posY[i] / cell)));
      const idx = r * cols + c;
      cellItems[cellCursor[idx]] = i;
      cellCursor[idx]++;
    }
  };
  const applyPointer = (i, out) => {
    const z = depth[i];
    const reach = GS.P_RANGE * (GS.F_REACH + z * GS.N_REACH);
    const dx = pX - posX[i], dy = pY - posY[i];
    const d2 = dx * dx + dy * dy;
    if (d2 > reach * reach) return;
    const dist = Math.sqrt(d2);
    const soft = Math.sqrt(d2 + GS.SOFT_SQ);
    const fade = 1 - dist / reach;
    const pull = GS.F_PULL + z * GS.N_PULL;
    const str = Math.min((S.gravity * GS.P_ACCEL * pull) / (soft * soft), GS.MAX_ACCEL) * fade * fade;
    const nx = dx / soft, ny = dy / soft;
    out[0] += nx * str - ny * str * GS.SWIRL;
    out[1] += ny * str + nx * str * GS.SWIRL;
  };
  const accel = new Float32Array(2);
  const step = (delta) => {
    const damp = Math.pow(1 - S.drag, delta * GS.REF_FPS);
    for (let i = 0; i < active; i++) {
      accel[0] = 0; accel[1] = 0;
      if (pActive) applyPointer(i, accel);
      let vx = (velX[i] + accel[0] * delta) * damp;
      let vy = (velY[i] + accel[1] * delta) * damp;
      const sp2 = vx * vx + vy * vy;
      if (sp2 > GS.MAX_SPEED * GS.MAX_SPEED) {
        const k = GS.MAX_SPEED / Math.sqrt(sp2);
        vx *= k; vy *= k;
      }
      velX[i] = vx; velY[i] = vy;
      posX[i] += (vx + driftX[i] * S.speed) * delta;
      posY[i] += (vy + driftY[i] * S.speed) * delta;
      if (posX[i] < 0) posX[i] += width; else if (posX[i] > width) posX[i] -= width;
      if (posY[i] < 0) posY[i] += height; else if (posY[i] > height) posY[i] -= height;
    }
  };
  const buildSegments = (cols, rows) => {
    const lim = S.connectDistance * S.connectDistance;
    let total = 0;
    const consider = (a, b) => {
      if (total >= maxSeg) return;
      const dx = posX[a] - posX[b], dy = posY[a] - posY[b];
      const d2 = dx * dx + dy * dy;
      if (d2 > lim || d2 === 0) return;
      const close = Math.pow(1 - Math.sqrt(d2) / S.connectDistance, GS.L_CURVE);
      const dw = GS.L_DF + ((depth[a] + depth[b]) / 2) * GS.L_DG;
      const lv = Math.min(GS.L_LEVELS - 1, Math.floor(close * dw * GS.L_LEVELS));
      const o = total * 4;
      segments[o] = posX[a]; segments[o + 1] = posY[a];
      segments[o + 2] = posX[b]; segments[o + 3] = posY[b];
      segLevel[total] = lv;
      total++;
    };
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const idx = row * cols + col;
        const s0 = cellStart[idx], s1 = cellStart[idx + 1];
        for (let a = s0; a < s1; a++) {
          const i = cellItems[a];
          for (let b = a + 1; b < s1; b++) consider(i, cellItems[b]);
          for (let n = 0; n < GS.FWD.length; n += 2) {
            const nc = col + GS.FWD[n], nr = row + GS.FWD[n + 1];
            if (nc < 0 || nc >= cols || nr >= rows) continue;
            const nIdx = nr * cols + nc;
            const ns = cellStart[nIdx], ne = cellStart[nIdx + 1];
            for (let b = ns; b < ne; b++) consider(i, cellItems[b]);
          }
        }
      }
    }
    return total;
  };
  const drawLinks = (total) => {
    const [r, g, b] = S.palette.base;
    for (let lv = 0; lv < GS.L_LEVELS; lv++) {
      const alpha = (GS.L_BASE * (lv + 1)) / GS.L_LEVELS;
      ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      ctx.lineWidth = GS.L_MINW + lv * GS.L_WSTEP;
      ctx.beginPath();
      let drew = false;
      for (let s = 0; s < total; s++) {
        if (segLevel[s] !== lv) continue;
        const o = s * 4;
        ctx.moveTo(segments[o], segments[o + 1]);
        ctx.lineTo(segments[o + 2], segments[o + 3]);
        drew = true;
      }
      if (drew) ctx.stroke();
    }
  };
  const drawStars = () => {
    const el = (performance.now() - startedAt) / 1000;
    for (let i = 0; i < active; i++) {
      const z = depth[i];
      const wave = S.still ? Math.sin(phase[i]) : Math.sin(el * rate[i] + phase[i]);
      const bright = (GS.F_ALPHA + z * GS.N_ALPHA) * (1 - S.twinkle * GS.TW_DEPTH * (1 - wave));
      const alpha = Math.max(0, Math.min(1, bright));
      if (alpha <= 0.01) continue;
      const core = S.starSize * (GS.F_SIZE + z * GS.N_SIZE) * jitter[i];
      const halo = core * S.glow * (GS.F_HALO + z * GS.N_HALO);
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprites[tintLevel[i]], posX[i] - halo, posY[i] - halo, halo * 2, halo * 2);
    }
    ctx.globalAlpha = 1;
  };
  const draw = (segTotal) => {
    ctx.clearRect(0, 0, width, height);
    if (S.connect && segTotal > 0) drawLinks(segTotal);
    drawStars();
  };
  const renderStatic = () => {
    const g = gridGeom();
    sortGrid(g.cell, g.cols, g.rows);
    const t = S.connect ? buildSegments(g.cols, g.rows) : 0;
    draw(t);
  };
  const tick = () => {
    if (destroyed || !running) return;
    const now = performance.now();
    const delta = Math.min((now - lastAt) / 1000, GS.MAX_DELTA);
    lastAt = now;
    step(delta);
    let total = 0;
    if (S.connect) {
      const g = gridGeom();
      sortGrid(g.cell, g.cols, g.rows);
      total = buildSegments(g.cols, g.rows);
    }
    draw(total);
    frame = requestAnimationFrame(tick);
  };
  resize();

  return {
    destroy() {
      destroyed = true; running = false;
      cancelAnimationFrame(frame);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.width = 0; canvas.height = 0;
      sprites.forEach(s => { s.width = 0; s.height = 0; });
    },
    render() { resize(); renderStatic(); },
    resize() { resize(); if (!running) renderStatic(); },
    setPointer(x, y, act) { pX = x; pY = y; pActive = act; },
    setRunning(next) {
      if (destroyed || running === next) return;
      running = next;
      if (next) { lastAt = performance.now(); frame = requestAnimationFrame(tick); }
      else cancelAnimationFrame(frame);
    },
    setSettings(next) {
      const chCount = next.count !== S.count;
      const chSprites = next.tint !== S.tint;
      S = next;
      if (chSprites) gsPaintSprites(sprites, next.palette, next.tint);
      if (chCount) seedPos(effCount());
    }
  };
}

function GravityStars({
  children, className = '',
  color = 'var(--band-ink, #f5f5f7)',
  connect = true, connectDistance = 130, count = 220,
  drag = 0.03, glow = 5.5, gravity = 1, speed = 1,
  starSize = 1.5, tint = 0.5, twinkle = 0.55
}) {
  const hostRef = useRef(null);
  const canvasRef = useRef(null);
  const ctrlRef = useRef(null);
  const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const [supported, setSupported] = useState(true);
  const [isActive, setIsActive] = useState(false);
  const [palette, setPalette] = useState({ base: GS.FB_BASE, cool: GS.FB_COOL, warm: GS.FB_WARM });

  /* Resolve warna dari token tema — ikut dark mode */
  useEffect(() => {
    const host = hostRef.current;
    if (!host) return;
    const [base, cool, warm] = gsResolveColors([color, GS.TINT_COOL, GS.TINT_WARM], host);
    setPalette({ base: base || GS.FB_BASE, cool: cool || GS.FB_COOL, warm: warm || GS.FB_WARM });
  }, [color]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctrl = createStarController(canvas);
    ctrlRef.current = ctrl;
    setSupported(!!ctrl);
    if (!ctrl) return;
    const obs = new ResizeObserver(() => ctrl.resize());
    obs.observe(canvas);
    return () => { obs.disconnect(); ctrl.destroy(); ctrlRef.current = null; };
  }, []);

  useEffect(() => {
    const host = hostRef.current;
    if (!(host && supported)) return;
    let onScreen = true;
    const sync = () => setIsActive(onScreen && document.visibilityState === 'visible');
    const io = new IntersectionObserver((entries) => {
      onScreen = entries.some(e => e.isIntersecting);
      sync();
    });
    io.observe(host);
    document.addEventListener('visibilitychange', sync);
    sync();
    return () => { io.disconnect(); document.removeEventListener('visibilitychange', sync); };
  }, [supported]);

  useEffect(() => {
    const ctrl = ctrlRef.current;
    if (!ctrl) return;
    ctrl.setSettings({
      connect, connectDistance: Math.max(connectDistance, 1),
      count: Math.max(GS.MIN_COUNT, Math.min(GS.MAX_COUNT, Math.round(count))),
      drag: Math.max(0, Math.min(1, drag)),
      glow: Math.max(glow, 1), gravity: Math.max(gravity, 0),
      palette, speed: Math.max(speed, 0), starSize: Math.max(starSize, 0.2),
      still: reduced, tint: Math.max(0, Math.min(1, tint)),
      twinkle: Math.max(0, Math.min(1, twinkle))
    });
    ctrl.render();
  }, [connect, connectDistance, count, drag, glow, gravity, palette, reduced, speed, starSize, tint, twinkle]);

  useEffect(() => {
    const ctrl = ctrlRef.current;
    if (!ctrl) return;
    const shouldRun = isActive && !reduced;
    ctrl.setRunning(shouldRun);
    if (!shouldRun) ctrl.render();
  }, [isActive, reduced]);

  useEffect(() => {
    const host = hostRef.current;
    const canvas = canvasRef.current;
    if (!(host && canvas) || reduced) return;
    const move = (e) => {
      const r = canvas.getBoundingClientRect();
      if (ctrlRef.current) ctrlRef.current.setPointer(e.clientX - r.left, e.clientY - r.top, true);
    };
    const leave = () => { if (ctrlRef.current) ctrlRef.current.setPointer(0, 0, false); };
    host.addEventListener('pointermove', move, { passive: true });
    host.addEventListener('pointerleave', leave);
    host.addEventListener('pointercancel', leave);
    return () => {
      host.removeEventListener('pointermove', move);
      host.removeEventListener('pointerleave', leave);
      host.removeEventListener('pointercancel', leave);
    };
  }, [reduced]);

  return html`
    <div class=${'gs ' + className} ref=${hostRef}>
      ${supported
        ? html`<div class="gs-sky" aria-hidden="true"><canvas ref=${canvasRef}></canvas></div>`
        : html`<div class="gs-sky gs-fallback" aria-hidden="true"></div>`}
      <div class="gs-in">${children}</div>
    </div>`;
}

    </div>`;
}

/* ---------------- Halaman: Portofolio ---------------- */
function PortoCard({ it, onOpen }) {
  const [fav, setFav] = useState(false);
  return html`
    <div class="pcard">
      <button type="button" class="pcard-link" aria-label=${'Lihat ' + it.title}
        onClick=${() => onOpen(it)}>
        <div class="pcard-box">
          <div class="pcard-img">
            <img src=${it.image} alt=${it.title} loading="lazy" decoding="async" width="480" height="360" />
            <span class="lb-open" aria-hidden="true"><span><${ZoomIn} class="ic-s"/> Lihat besar</span></span>
            <span type="button" role="button" tabindex="-1" class=${'pcard-fav' + (fav ? ' on' : '')}
              aria-label="Tambah ke favorit" aria-pressed=${fav}
              onClick=${(e) => { e.stopPropagation(); setFav(f => !f); }}>
              <${Heart} />
            </span>
            ${it.badge && html`<span class="pcard-badge">${it.badge}</span>`}
          </div>
          <div class="pcard-body">
            <h3 class="pcard-title">${it.title}</h3>
            <p class="pcard-meta">${it.meta}</p>
            ${it.date && html`<p class="pcard-date">${it.date}</p>`}
          </div>
          <div class="pcard-foot">
            ${it.rating && html`
              <span class="pcard-rate"><${Star} /> ${it.rating}</span>
              <span class="pcard-rev">${it.reviews > 0 ? '· (' + it.reviews + ')' : ''}</span>
            `}
            <span class="pcard-year">${it.year}</span>
          </div>
        </div>
      </button>
    </div>`;
}

function PortoSection({ title, items, onOpen, onShowAll }) {
  const scRef = useRef(null);
  const scroll = (dir) => {
    if (scRef.current) scRef.current.scrollBy({ left: dir * 320, behavior: 'smooth' });
  };
  return html`
    <div class="psec">
      <div class="wrap">
        <div class="psec-head">
          <h2 class="psec-title">${title} <span>›</span></h2>
          <div class="psec-ctrl">
            <button type="button" class="psec-btn" aria-label="Geser ke kiri" onClick=${() => scroll(-1)}><${ChevronLeft}/></button>
            <button type="button" class="psec-btn" aria-label="Geser ke kanan" onClick=${() => scroll(1)}><${ChevronRight}/></button>
            <button type="button" class="psec-all" onClick=${() => onShowAll()}>Show all</button>
          </div>
        </div>
        <div class="psec-scroll" ref=${scRef}>
          ${items.map(it => html`<${PortoCard} key=${it.id} it=${it} onOpen=${onOpen} />`)}
        </div>
      </div>
    </div>`;
}

/* --- LIGHTBOX --- */
function Lightbox({ secTitle, items, index, onClose, onNav }) {
  const it = items[index];
  const [fav, setFav] = useState(false);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowLeft') onNav(-1);
      else if (e.key === 'ArrowRight') onNav(1);
    };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [onClose, onNav]);

  if (!it) return null;

  return html`
    <div class="lb" role="dialog" aria-modal="true" aria-label=${it.title}
      onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div class="lb-card">
        <button type="button" class="lb-close" aria-label="Tutup" onClick=${onClose}><${X}/></button>
        <div class="lb-imgwrap">
          <img src=${it.image} alt=${it.title} decoding="async" />
          ${it.badge && html`<span class="lb-badge">${it.badge}</span>`}
          <button type="button" class=${'lb-fav' + (fav ? ' on' : '')}
            aria-label="Tambah ke favorit" aria-pressed=${fav}
            onClick=${() => setFav(f => !f)}><${Heart} /></button>
        </div>
        <div class="lb-info">
          <p class="lb-cat">${secTitle}</p>
          <h3 class="lb-title">${it.title}</h3>
          ${it.desc && html`<p class="lb-desc">${it.desc}</p>`}
          ${it.tags && html`
            <div class="lb-tags">${it.tags.map(t => html`<span key=${t} class="tag">${t}</span>`)}</div>`}
          <div class="lb-foot">
            ${it.rating && html`
              <span class="lb-rate"><${Star} /> ${it.rating}
                <span class="pcard-rev" style="font-weight:400;color:var(--muted)">· (${it.reviews})</span>
              </span>`}
            <div class="lb-nav">
              <span class="lb-idx">${index + 1} / ${items.length}</span>
              <button type="button" class="lb-btn" aria-label="Karya sebelumnya" onClick=${() => onNav(-1)}><${ChevronLeft}/></button>
              <button type="button" class="lb-btn" aria-label="Karya berikutnya" onClick=${() => onNav(1)}><${ChevronRight}/></button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

function Portofolio() {
  const [activeCat, setActiveCat] = useState(null);
  const [lb, setLb] = useState(null);

  const sec = activeCat ? PORTO_SECTIONS.find(s => s.id === activeCat) : null;

  const showAll = (id) => {
    setActiveCat(id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const openLightbox = (secIdx) => (it) => {
    const s = PORTO_SECTIONS[secIdx];
    setLb({ secIdx, itemIdx: s.items.indexOf(it) });
  };
  const navLightbox = useCallback((dir) => {
    setLb(prev => {
      if (!prev) return prev;
      const s = PORTO_SECTIONS[prev.secIdx];
      const n = (prev.itemIdx + dir + s.items.length) % s.items.length;
      return { secIdx: prev.secIdx, itemIdx: n };
    });
  }, []);

  return html`
    <div class="page">
      <div class="wrap porto-head">
        <p class="eyebrow">Galeri & Koleksi</p>
        <h1 class="alt-h1"><${AnimatedLetterText} text="Portofolio" letter="o" idSuffix="pv" /></h1>
        <p class="lead" style="margin-top:8px">Klik kartu untuk melihat karya lebih besar — pilih kategori di bawah untuk mempermudah pencarian.</p>

        <div class="ptabs" role="tablist" aria-label="Kategori portofolio">
          <button type="button" role="tab" aria-selected=${activeCat === null}
            class=${'ptab' + (activeCat === null ? ' on' : '')}
            onClick=${() => { setActiveCat(null); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
            Semua <span class="ptab-n">${TOTAL_WORKS}</span>
          </button>
          ${PORTO_SECTIONS.map(s => html`
            <button key=${s.id} type="button" role="tab" aria-selected=${activeCat === s.id}
              class=${'ptab' + (activeCat === s.id ? ' on' : '')}
              onClick=${() => showAll(s.id)}>
              ${s.title} <span class="ptab-n">${s.items.length}</span>
            </button>`)}
        </div>
      </div>

      ${sec ? html`
        <div class="wrap anim-fade" key=${sec.id} style="padding-top:26px">
          <span class="sa-count"><${Layers} class="ic-s"/> ${sec.items.length} karya dalam ${sec.title}</span>
          <div class="sa-grid" style="margin-top:20px">
            ${sec.items.map(it => html`<${PortoCard} key=${it.id} it=${it}
              onOpen=${() => openLightbox(PORTO_SECTIONS.indexOf(sec))(it)} />`)}
          </div>
        </div>` : html`
        ${PORTO_SECTIONS.map((s, i) => html`
          <${PortoSection} key=${s.id} title=${s.title} items=${s.items}
            onOpen=${openLightbox(i)}
            onShowAll=${() => showAll(s.id)} />`)}`}

      ${lb && html`
        <${Lightbox}
          secTitle=${PORTO_SECTIONS[lb.secIdx].title}
          items=${PORTO_SECTIONS[lb.secIdx].items}
          index=${lb.itemIdx}
          onClose=${() => setLb(null)}
          onNav=${navLightbox} />`}

      <${CtaBand} title="Punya proyek di kepala?"
        text="Mari diskusikan bagaimana saya bisa membantu mewujudkannya."
        ctaLabel="Hubungi Saya" href="#/kontak" />
    </div>`;
}

/* ---------------- App ---------------- */
function App() {
  const [route] = useHashRoute();
  useEffect(() => { document.title = TITLES[route] || TITLES.beranda; }, [route]);
  return html`
    <${Header} route=${route} />
    <main class="anim-page" key=${route}>
      ${route === 'beranda' && html`<${Beranda} />`}
      ${route === 'tentang' && html`<${Tentang} />`}
      ${route === 'portofolio' && html`<${Portofolio} />`}
      ${route === 'kontak' && html`<${Kontak} />`}
    </main>
    <${Footer} />`;
}

try {
  const ROOT = document.getElementById('root');
  ROOT.innerHTML = '';
  render(html`<${App}/>`, ROOT);
} catch (err) {
  if (window.__showAppError) window.__showAppError(err && err.message ? err.message : String(err));
  throw err;
}
