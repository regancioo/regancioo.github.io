<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sachio Regan — Portofolio</title>
<meta name="description" content="Portofolio Sachio Regan — UI/UX Designer & Social Media Specialist." />
<meta name="theme-color" content="#ffffff" />
<link rel="shortcut icon" href="melogo.png" type="image/x-icon" />

<!-- Set tema SEBELUM CSS dimuat → anti flash putih/hitam saat load -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#050506' : '#ffffff');
})();
</script>

<!-- ERROR WATCHDOG: bila app gagal mount, tampilkan error di layar (bukan blank) -->
<script>
(function () {
  var shown = false;
  function show(msg) {
    if (shown) return;
    shown = true;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:auto 16px 16px 16px;z-index:99999;background:#2b0000;color:#ffd9d9;' +
      'border:1px solid #ff6b6b;border-radius:12px;padding:14px 16px;font:13px/1.5 monospace;white-space:pre-wrap;' +
      'box-shadow:0 10px 30px rgba(0,0,0,.4);max-height:45vh;overflow:auto';
    d.innerHTML = '<b style="color:#ff9b9b">⚠ Gagal memuat aplikasi.</b>\n' +
      String(msg || 'Penyebab tidak diketahui.') +
      '\n\nPeriksa juga: (1) file berakhir dengan </html>, (2) koneksi internet aktif (butuh esm.sh), (3) detail di Console (F12).';
    document.body.appendChild(d);
  }
  window.__showAppError = show;
  window.addEventListener('error', function (e) {
    if (!shown) show((e && e.message) ? e.message : 'Script error (lihat Console F12).');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    if (!shown) show((e && e.reason && e.reason.message) ? e.reason.message : 'Promise error.');
  });
  setTimeout(function () {
    var r = document.getElementById('root');
    if (r && r.childElementCount === 0) show('Aplikasi belum ter-render dalam 5 detik.\nKemungkinan: file HTML terpotong saat copy, atau CDN esm.sh tidak terjangkau.');
  }, 5000);
})();
</script>

<link rel="preconnect" href="https://esm.sh" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://images.unsplash.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Caveat:wght@600&family=JetBrains+Mono:wght@400;600&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet" />

<style>
  /* ================== TEMA: LIGHT (Apple putih) / DARK ================== */
  :root{
    color-scheme: light;
    --bg:#ffffff; --bg-soft:#f5f5f7; --card:#ffffff;
    --ink:#1d1d1f; --muted:#86868b; --soft:#515154;
    --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.14);
    --accent:#0071e3; --accent-2:#0077ed; --on-accent:#fff;
    --accent-soft:rgba(0,113,227,.08); --accent-line:rgba(0,113,227,.18); --accent-ring:rgba(0,113,227,.13);
    --hover:rgba(0,0,0,.05); --hover-2:rgba(0,0,0,.07);
    --hdr:rgba(255,255,255,.85);
    --shadow:0 24px 48px -20px rgba(0,0,0,.16); --shadow-sm:0 4px 12px rgba(0,0,0,.08);
    --band:#1d1d1f; --band-ink:#f5f5f7; --band-muted:rgba(255,255,255,.65);
    --dots:rgba(0,0,0,.055);
    --fl-shadow:0 24px 48px -16px rgba(0,0,0,.35);
  }
  [data-theme="dark"]{
    color-scheme: dark;
    --bg:#050506; --bg-soft:#1c1c1e; --card:#141416;
    --ink:#f5f5f7; --muted:#98989d; --soft:#a1a1a6;
    --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.18);
    --accent:#2997ff; --accent-2:#409cff; --on-accent:#fff;
    --accent-soft:rgba(41,151,255,.12); --accent-line:rgba(41,151,255,.3); --accent-ring:rgba(41,151,255,.25);
    --hover:rgba(255,255,255,.08); --hover-2:rgba(255,255,255,.11);
    --hdr:rgba(10,10,12,.8);
    --shadow:0 24px 48px -18px rgba(0,0,0,.7); --shadow-sm:0 4px 12px rgba(0,0,0,.5);
    --band:#161618; --band-ink:#f5f5f7; --band-muted:rgba(255,255,255,.6);
    --dots:rgba(255,255,255,.06);
    --fl-shadow:0 24px 48px -14px rgba(0,0,0,.8);
  }
  html.theme-switch, html.theme-switch *,
  html.theme-switch *::before, html.theme-switch *::after{
    transition: background-color .35s ease, color .35s ease,
      border-color .35s ease, box-shadow .35s ease, background .35s ease !important;
  }

  /* ================== BASE ================== */
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit}
  button{font:inherit;cursor:pointer;color:inherit}
  .wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 22px}
  .page{padding-top:104px}
  .section{padding:76px 0}
  .section-soft{background:var(--bg-soft)}
  .cv-auto{content-visibility:auto;contain-intrinsic-size:auto 900px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
  .ic{width:20px;height:20px;flex-shrink:0}
  .ic-s{width:13px;height:13px;flex-shrink:0}
  .center{text-align:center}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes zoomIn95{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .anim-fade{animation:fadeIn .2s ease-out}
  .anim-page{animation:pageIn .28s ease-out}

  /* ================== TIPOGRAFI ================== */
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
  .h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(38px,6.8vw,68px);line-height:1.03;letter-spacing:-.025em;margin:0 0 20px}
  .h2{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(26px,4vw,38px);letter-spacing:-.015em;line-height:1.14;margin:0 0 12px}
  .accent{color:var(--accent)}
  .lead{color:var(--muted);font-size:clamp(15px,1.9vw,18px);margin:0 auto}

  /* ================== TOMBOL ================== */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;transition:transform .2s ease,opacity .2s ease,background .2s ease,box-shadow .2s ease}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--ink);color:var(--bg);box-shadow:0 10px 24px -12px rgba(0,0,0,.35)}
  .btn-primary:hover{opacity:.86}
  [data-theme="dark"] .btn-primary{box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
  .btn-ghost{border-color:var(--line-strong);color:var(--ink);background:var(--card)}
  .btn-ghost:hover{background:var(--bg-soft)}
  /* Tombol di atas langit berbintang */
  .btn-onstar{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .btn-onstar:hover{background:rgba(255,255,255,.26);opacity:1}

  /* ================== HEADER — logo + regancioo ================== */
  .hdr{position:fixed;top:0;left:0;right:0;z-index:500;padding:10px 0;border-bottom:1px solid transparent;
    transition:background-color .3s ease,box-shadow .3s ease,padding .3s ease,border-color .3s ease}
  .hdr-solid{background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line);box-shadow:var(--shadow-sm);padding:6px 0}
  @media(max-width:768px){.hdr-solid{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}}
  .hdr-in{display:flex;align-items:center;justify-content:space-between;height:48px;gap:10px}
  .logo{font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em;text-decoration:none;
    display:inline-flex;align-items:center;gap:8px}
  .logo-img{width:28px;height:28px;object-fit:contain;display:block;flex-shrink:0}
  .logo-txt{color:var(--ink)}
  .nav{display:flex;align-items:center;gap:2px}
  .nav a{padding:8px 15px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s ease,background .2s ease}
  .nav a:hover{color:var(--ink);background:var(--hover)}
  .nav a.on{color:var(--ink);background:var(--hover-2)}
  .hdr-right{display:flex;align-items:center;gap:8px}
  .theme-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;transition:background .2s ease,transform .2s ease,border-color .2s ease}
  .theme-btn:hover{background:var(--bg-soft);transform:translateY(-1px)}
  .theme-btn:active{transform:scale(.94)}
  .theme-btn .moon{display:block}.theme-btn .sun{display:none}
  [data-theme="dark"] .theme-btn .moon{display:none}
  [data-theme="dark"] .theme-btn .sun{display:block}
  .hdr-cta{margin-left:2px;padding:9px 18px !important;font-size:13.5px}
  .burger{display:none;width:42px;height:42px;border:1px solid var(--line);background:var(--card);border-radius:12px;align-items:center;justify-content:center}
  .m-menu{position:absolute;top:calc(100% + 8px);left:14px;right:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--shadow);animation:slideDown .2s ease-out}
  .m-menu a{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-radius:12px;text-decoration:none;font-weight:600;color:var(--ink)}
  .m-menu a.on{background:var(--bg-soft);color:var(--accent)}
  @media(max-width:820px){.nav,.hdr-cta{display:none}.burger{display:flex}}

  /* ================== HERO — GridPulse + Parallax Floating ================== */
  .hero2{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:130px 0 90px}
  .gp{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
    --gp-line:rgba(0,0,0,.07);
    background-image:linear-gradient(to right,var(--gp-line) 1px,transparent 1px),
      linear-gradient(to bottom,var(--gp-line) 1px,transparent 1px);
    background-size:var(--gp-cell,24px) var(--gp-cell,24px);
    -webkit-mask-image:linear-gradient(to bottom,#000 92%,transparent);
    mask-image:linear-gradient(to bottom,#000 92%,transparent)}
  [data-theme="dark"] .gp{--gp-line:rgba(255,255,255,.08)}
  .gp canvas{position:absolute;inset:0;width:100%;height:100%}

  .fl-wrap{position:absolute;inset:0;z-index:1;pointer-events:none}
  .fl{position:absolute;animation:fadeIn .7s ease-out both;animation-delay:var(--fd,0s);will-change:transform}
  .fl-in{width:100%;height:100%;border-radius:16px;overflow:hidden;box-shadow:var(--fl-shadow);border:1px solid var(--line)}
  .fl-in img{width:100%;height:100%;object-fit:cover}
  .fl-1{top:24%;left:4%;width:clamp(60px,9vw,124px);aspect-ratio:4/3;--fd:.5s}
  .fl-2{top:6%;left:10%;width:clamp(100px,17vw,220px);aspect-ratio:5/4;--fd:.7s}
  .fl-3{top:auto;bottom:8%;left:7%;width:clamp(96px,18vw,232px);aspect-ratio:1/1;--fd:.9s}
  .fl-4{top:3%;right:8%;width:clamp(100px,17vw,224px);aspect-ratio:13/11;--fd:1.1s}
  .fl-5{top:auto;bottom:6%;right:6%;width:clamp(112px,22vw,300px);aspect-ratio:1/1;--fd:1.3s}
  .fl-r{transform:rotate(var(--rot,0deg))}
  .fl-1 .fl-in{--rot:-3deg}.fl-2 .fl-in{--rot:-12deg}
  .fl-3 .fl-in{--rot:-4deg}.fl-4 .fl-in{--rot:6deg}.fl-5 .fl-in{--rot:14deg}
  @media(max-width:560px){
    .fl-1,.fl-4{display:none}
    .fl-2{left:2%}.fl-5{right:2%}
    .fl-3{bottom:4%}
  }
  .hero2-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;
    width:min(92vw,760px);pointer-events:auto}
  .h1-hero{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(38px,8vw,84px);
    line-height:1.05;letter-spacing:-.03em;margin:0;display:flex;flex-direction:column;align-items:center;
    animation:riseIn .5s ease-out .25s both}
  .h1-hero .line{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;white-space:pre-wrap}
  .hero-sub{animation:riseIn .5s ease-out .45s both}
  .hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:36px;animation:riseIn .5s ease-out .6s both}
  .hero-hint{margin-top:46px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    animation:fadeIn .8s ease-out 1.2s both}
  .gp-guard{text-shadow:0 0 6px var(--bg),0 0 14px var(--bg),0 0 30px var(--bg),0 0 52px var(--bg)}
  .stats{display:flex;justify-content:center;gap:clamp(26px,6vw,64px);flex-wrap:wrap;margin-top:52px;padding-top:34px;border-top:1px solid var(--line)}
  .stat b{display:block;font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em}
  .stat span{color:var(--muted);font-size:13px}

  /* --- TextRotate --- */
  .tr{display:inline-flex;position:relative;color:var(--accent);padding-bottom:.14em;margin-bottom:-.14em}
  .tr-viewport{display:inline-flex;flex-wrap:wrap;white-space:pre;overflow:hidden;justify-content:center}
  .tr-word{display:inline-flex}
  .tr-sp{white-space:pre}
  .tr-char{display:inline-block;animation:trIn .5s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
  @keyframes trIn{from{transform:translateY(112%);opacity:0}to{transform:translateY(0);opacity:1}}
  .tr-viewport.tr-out .tr-char{animation:none;transform:translateY(-130%);opacity:0;
    transition:transform .38s cubic-bezier(.55,0,.85,.55),opacity .38s;transition-delay:var(--d,0s)}

  /* =========================================================
     ANIMATED LETTER TEXT — berlian biru tema
     ========================================================= */
  .alt{display:inline-flex;align-items:center;color:var(--ink)}
  .alt-visual{position:relative;display:inline-flex;align-items:center;justify-content:center;margin:-.02em;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.25)) drop-shadow(0 2px 4px rgba(0,0,0,.15))}
  .alt-outer{width:.72em;height:.72em;display:block}
  .alt-dwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .alt-diamond{width:.3em;height:.3em;display:block;animation:diamond-rotate 6s linear infinite;will-change:transform}
  @keyframes diamond-rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  .alt-h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(40px,7vw,72px);letter-spacing:-.03em;line-height:1.05;margin:0 0 10px}

  /* ================== BRAND MARQUEE ================== */
  .mq-wrap{position:relative;padding:34px 0 10px;text-align:center}
  .mq-label{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
  .marquee{overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .marquee-track{display:flex;width:max-content;animation:marquee 30s linear infinite;will-change:transform}
  .marquee:hover .marquee-track{animation-play-state:paused}
  @keyframes marquee{to{transform:translateX(-50%)}}
  .mq-item{display:inline-flex;align-items:center;gap:10px;margin-right:64px;white-space:nowrap;
    font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(17px,2.4vw,22px);letter-spacing:-.01em;
    color:var(--muted);opacity:.65;transition:opacity .2s ease}
  .mq-item:hover{opacity:1}
  .mq-item i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}

  /* ================== LAYANAN ================== */
  .svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:44px;text-align:left}
  .svc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;transition:transform .25s ease,box-shadow .25s ease}
  .svc:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .svc-ic{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .svc h3{margin:0 0 6px;font-size:17px;font-weight:600}
  .svc p{margin:0;color:var(--muted);font-size:14px}

  /* ================== COVERFLOW ================== */
  .cf-frame{cursor:grab;overflow:hidden;padding:2.5rem 0;outline:none;touch-action:pan-y;contain:layout}
  .cf-frame:active{cursor:grabbing}
  .cf-frame:focus-visible{box-shadow:0 0 0 2px var(--accent);border-radius:16px}
  .cf-inner{position:relative;height:var(--cf-card);transform-style:preserve-3d;user-select:none;-webkit-user-select:none}
  .cf-card{position:absolute;left:50%;top:0;width:var(--cf-card);aspect-ratio:1/1;overflow:hidden;border-radius:1rem;background:var(--bg-soft);
    box-shadow:0 20px 25px -5px rgba(0,0,0,.12),0 8px 10px -6px rgba(0,0,0,.1)}
  [data-theme="dark"] .cf-card{box-shadow:0 20px 30px -8px rgba(0,0,0,.7)}
  .cf-card img{height:100%;width:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .cf-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:200;width:42px;height:42px;border-radius:9999px;display:flex;align-items:center;justify-content:center;
    background:var(--hdr);backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:var(--shadow-sm);color:var(--ink);transition:background .2s ease}
  .cf-nav.left{left:12px}.cf-nav.right{right:12px}
  .cf-nav:hover{background:var(--card)}
  .cf-dot{width:8px;height:8px;border-radius:9999px;background:var(--ink);border:none;padding:0;cursor:pointer;transition:opacity .2s ease}

  /* =========================================================
     GRAVITY STARS CTA — kotak "Punya proyek di kepala?"
     Langit gelap + bintang yang tertarik ke kursor
     ========================================================= */
  .gs{position:relative;isolation:isolate;overflow:hidden;border-radius:22px;background:var(--band);border:1px solid var(--line)}
  .gs-sky{position:absolute;inset:0;z-index:0;pointer-events:none}
  .gs-sky canvas{width:100%;height:100%;display:block}
  .gs-fallback{position:absolute;inset:0;opacity:.6;
    background-image:
      radial-gradient(circle at 30% 30%, var(--band-ink) 0px, transparent 1.5px),
      radial-gradient(circle at 70% 65%, var(--band-ink) 0px, transparent 1px);
    background-size:96px 96px, 53px 53px}
  .gs-in{position:relative;z-index:1;padding:clamp(36px,6vw,64px);text-align:center;color:var(--band-ink)}
  .gs-in h2{color:var(--band-ink);text-shadow:0 2px 12px rgba(0,0,0,.5)}
  .gs-in p{color:var(--band-muted);max-width:480px;margin:0 auto 26px;text-shadow:0 1px 6px rgba(0,0,0,.45)}

  /* ================== TENTANG ================== */
  .about-grid{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:clamp(56px,8vw,110px);align-items:start}
  @media(max-width:900px){
    .about-grid{grid-template-columns:1fr;gap:72px;justify-items:center}
    .about-grid .bio{max-width:560px;width:100%}
  }
  .bio{max-width:560px}
  .bio>p{color:var(--muted);margin:0 0 14px}
  .bio strong{color:var(--ink)}
  .skill-row{margin-top:26px}
  .skill-row h4{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg-soft);color:var(--soft);border:1px solid var(--line)}
  .focus-list{display:flex;flex-direction:column;gap:10px}
  .focus{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .focus b{font-size:14.5px;display:block}
  .focus p{margin:0;font-size:13px;color:var(--muted)}
  .focus .svc-ic{width:38px;height:38px;margin:0;border-radius:11px}

  /* =========================================================
     PORTOFOLIO — tab kategori + carousel + lightbox
     ========================================================= */
  .porto-head{text-align:center;margin-bottom:4px}
  .ptabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 6px}
  .ptab{display:inline-flex;align-items:center;gap:2px;padding:9px 16px;border-radius:999px;
    border:1px solid var(--line-strong);background:var(--card);font-size:14px;font-weight:600;color:var(--muted);
    transition:all .2s ease}
  .ptab:hover{color:var(--ink);background:var(--bg-soft)}
  .ptab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .ptab-n{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;margin-left:7px;
    border-radius:999px;background:var(--bg-soft);color:var(--soft);font-size:10.5px;font-family:'JetBrains Mono',monospace}
  .ptab.on .ptab-n{background:rgba(255,255,255,.22);color:var(--bg)}
  @media(max-width:560px){.ptab{padding:8px 13px;font-size:13px}}

  .psec{width:100%;padding:18px 0}
  .psec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .psec-title{font-size:clamp(16px,2vw,20px);font-weight:600;letter-spacing:-.01em;margin:0}
  .psec-title span{color:var(--muted);font-weight:500}
  .psec-ctrl{display:flex;align-items:center;gap:4px}
  .psec-btn{width:28px;height:28px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);
    display:flex;align-items:center;justify-content:center;transition:background .2s ease,transform .2s ease}
  .psec-btn:hover{background:var(--bg-soft)}
  .psec-btn:active{transform:scale(.92)}
  .psec-btn svg{width:14px;height:14px}
  .psec-all{margin-left:6px;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;background:none;border:none;padding:0}
  .psec-all:hover{text-decoration:underline;text-underline-offset:3px}
  @media(max-width:767px){.psec-all{display:none}}
  .psec-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 4px 10px;scroll-snap-type:x mandatory;
    scrollbar-width:none;-ms-overflow-style:none;margin:0 -4px}
  .psec-scroll::-webkit-scrollbar{display:none}

  .pcard{width:240px;flex:0 0 auto;scroll-snap-align:start}
  @media(min-width:768px){.pcard{width:260px}}
  .pcard-link{display:block;border-radius:14px;text-decoration:none;color:inherit;background:none;border:none;padding:0;text-align:left;cursor:pointer}
  .pcard-box{display:flex;flex-direction:column;height:320px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .3s ease,transform .3s ease}
  .pcard-link:hover .pcard-box{box-shadow:var(--shadow-sm);transform:translateY(-2px)}
  .pcard-img{position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;background:var(--bg-soft)}
  .pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
  .pcard-link:hover .pcard-img img{transform:scale(1.05)}
  .pcard-fav{position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;border-radius:999px;border:none;
    background:rgba(255,255,255,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .2s ease,transform .2s ease}
  .pcard-fav:hover{background:#fff;transform:scale(1.08)}
  .pcard-fav:active{transform:scale(.9)}
  .pcard-fav svg{width:15px;height:15px}
  .pcard-fav.on{color:var(--accent)}
  .pcard-fav.on svg{fill:currentColor;stroke:currentColor}
  [data-theme="dark"] .pcard-fav{background:rgba(20,20,22,.82);color:var(--ink)}
  [data-theme="dark"] .pcard-fav:hover{background:rgba(40,40,44,.95)}
  .pcard-badge{position:absolute;top:8px;left:8px;z-index:2;padding:2px 8px;border-radius:8px;
    background:rgba(255,255,255,.92);color:var(--ink);font-size:11px;font-weight:600;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  [data-theme="dark"] .pcard-badge{background:rgba(20,20,22,.92)}
  .pcard-body{padding:12px 10px 6px;display:flex;flex-direction:column}
  .pcard-title{margin:0 0 2px;font-size:14px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
  .pcard-meta{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
  .pcard-date{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .pcard-foot{margin-top:auto;display:flex;align-items:center;gap:4px;padding:6px 10px 10px;font-size:12px}
  .pcard-rate{display:flex;align-items:center;gap:3px;font-weight:600}
  .pcard-rate svg{width:12px;height:12px;fill:currentColor}
  .pcard-rev{color:var(--muted)}
  .pcard-year{margin-left:auto;font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px}

  .sa-back{display:inline-flex;align-items:center;gap:6px;margin:0 0 18px;padding:8px 16px;border-radius:999px;
    border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;
    transition:background .2s ease,transform .2s ease}
  .sa-back:hover{background:var(--bg-soft);transform:translateY(-1px)}
  .sa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;text-align:left}
  .sa-grid .pcard{width:100%}
  .sa-count{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
    padding:4px 12px;border-radius:999px;background:var(--bg-soft);border:1px solid var(--line);margin-top:14px}

  /* --- LIGHTBOX --- */
  .lb{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(8,8,10,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    animation:fadeIn .22s ease-out}
  [data-theme="dark"] .lb{background:rgba(0,0,0,.86)}
  .lb-card{position:relative;width:min(94vw,880px);max-height:90vh;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;
    box-shadow:0 40px 90px -20px rgba(0,0,0,.5);animation:zoomIn95 .26s ease-out}
  .lb-imgwrap{position:relative;width:100%;background:var(--bg-soft);max-height:min(58vh,560px);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .lb-imgwrap img{width:100%;height:100%;object-fit:contain;max-height:min(58vh,560px)}
  .lb-badge{position:absolute;top:14px;left:14px;padding:4px 12px;border-radius:999px;
    background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;font-weight:600;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  [data-theme="dark"] .lb-badge{background:rgba(20,20,22,.92)}
  .lb-fav{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:999px;border:none;
    background:rgba(255,255,255,.9);backdrop-filter:blur(4px);color:var(--ink);
    display:flex;align-items:center;justify-content:center;transition:transform .2s ease,background .2s ease}
  .lb-fav:hover{transform:scale(1.08);background:#fff}
  .lb-fav svg{width:17px;height:17px}
  .lb-fav.on{color:var(--accent)}
  .lb-fav.on svg{fill:currentColor;stroke:currentColor}
  [data-theme="dark"] .lb-fav{background:rgba(20,20,22,.9)}
  .lb-close{position:absolute;top:-46px;right:0;width:36px;height:36px;border-radius:999px;border:none;
    background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;
    transition:background .2s ease,transform .2s ease}
  .lb-close:hover{background:rgba(255,255,255,.3);transform:rotate(90deg)}
  .lb-info{padding:18px 22px 20px;overflow-y:auto}
  .lb-cat{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
  .lb-title{margin:0 0 8px;font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(19px,2.6vw,26px);letter-spacing:-.015em;line-height:1.2}
  .lb-desc{margin:0 0 14px;color:var(--muted);font-size:14.5px}
  .lb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .lb-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding-top:14px;border-top:1px solid var(--line)}
  .lb-rate{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
  .lb-rate svg{width:14px;height:14px;fill:currentColor}
  .lb-nav{display:flex;align-items:center;gap:8px}
  .lb-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);
    display:flex;align-items:center;justify-content:center;transition:background .2s ease,transform .2s ease}
  .lb-btn:hover{background:var(--bg-soft)}
  .lb-btn:active{transform:scale(.92)}
  .lb-idx{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);padding:0 4px}
  .lb-open{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s ease;
    background:linear-gradient(to top,rgba(0,0,0,.45),transparent 55%);pointer-events:none}
  .lb-open span{margin-top:auto;margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;
    padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font-size:11.5px;font-weight:600;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  [data-theme="dark"] .lb-open span{background:rgba(20,20,22,.92)}
  .pcard-link:hover .lb-open{opacity:1;pointer-events:none}

  /* ================== KONTAK ================== */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,64px)}
  @media(max-width:880px){.contact-grid{grid-template-columns:1fr}}
  .c-rows{display:flex;flex-direction:column;gap:12px;margin-top:26px}
  .c-row{display:flex;gap:14px;align-items:center;padding:15px 16px;border:1px solid var(--line);border-radius:16px;text-decoration:none;background:var(--card);transition:transform .2s ease,box-shadow .2s ease}
  .c-row:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .c-ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .c-row b{display:block;font-size:14.5px}
  .c-row small{display:block;color:var(--muted);font-size:13px}
  .socials{display:flex;gap:10px;margin-top:22px}
  .soc{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;background:var(--card);transition:all .2s ease}
  .soc:hover{background:var(--ink);color:var(--bg);transform:translateY(-2px)}
  .form{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,34px);align-self:start}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg-soft);font:inherit;font-size:14.5px;color:var(--ink);outline:none;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
  .input::placeholder{color:var(--muted)}
  .input:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-ring)}
  textarea.input{resize:vertical;min-height:120px}
  .form-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 10px;animation:zoomIn95 .25s ease-out}
  .ok-ic{width:56px;height:56px;border-radius:50%;background:rgba(52,199,89,.14);color:#34C759;display:flex;align-items:center;justify-content:center}

  /* ================== FOOTER ================== */
  .foot{border-top:1px solid var(--line);padding:26px 0}
  .foot-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
  .foot nav{display:flex;gap:16px;flex-wrap:wrap}
  .foot nav a{text-decoration:none;color:var(--muted)}
  .foot nav a:hover{color:var(--ink)}

  /* ================== ID CARD LANYARD (ikut tema) ================== */
  .idcl-root{
    --idcl-accent:#5b8cff; --idcl-accent-dim:#2f4488;
    --idcl-card:#faf7f1; --idcl-card-2:#efeadf;
    --idcl-card-ink:#15171d; --idcl-card-soft:#666c78; --idcl-card-line:#e1dbcb;
    --idcl-hint-bg:rgba(255,255,255,.88); --idcl-hint-ink:#5b6270; --idcl-hint-line:rgba(0,0,0,.08);
    --idcl-font-display:'Archivo','Arial Narrow',sans-serif;
    --idcl-font-mono:'JetBrains Mono','Consolas',monospace;
    --idcl-font-script:'Caveat',cursive;
    font-family:'Work Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  }
  [data-theme="dark"] .idcl-root{
    --idcl-accent:#6ea8ff; --idcl-accent-dim:#8fb1f5;
    --idcl-card:#2b2b31; --idcl-card-2:#232329;
    --idcl-card-ink:#f0ede6; --idcl-card-soft:#9b9ba3; --idcl-card-line:#3d3d45;
    --idcl-hint-bg:rgba(28,28,30,.92); --idcl-hint-ink:#a1a1a6; --idcl-hint-line:rgba(255,255,255,.12);
  }
  .idcl-root *{box-sizing:border-box}
  .idcl-stage{position:relative;width:100%;overflow:visible;contain:layout}
  .idcl-rail{position:absolute;top:0;left:50%;width:64px;height:6px;transform:translateX(-50%);background:linear-gradient(180deg,#3a4150,#21252f);border-radius:0 0 4px 4px;box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none;z-index:4}
  .idcl-swing{position:absolute;top:0;left:50%;width:0;display:flex;flex-direction:column;align-items:center;transform-origin:top center;will-change:transform;pointer-events:none}
  .idcl-rope-line{width:2px;height:var(--rope,120px);border-radius:1px;background:linear-gradient(180deg,#4a5162 0%,#262a35 100%);transform-origin:top center;will-change:transform}
  .idcl-lower{display:flex;flex-direction:column;align-items:center;will-change:transform;position:relative}
  .idcl-clasp{position:relative;z-index:3;width:16px;height:22px;margin-top:-2px;border-radius:5px;background:linear-gradient(180deg,#4a5162,#1e222c);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 8px rgba(0,0,0,.35)}
  .idcl-card{position:relative;z-index:2;margin-top:-20px;width:clamp(196px,60vw,236px);aspect-ratio:236/460;perspective:1400px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transform-origin:top center;pointer-events:auto;transition:transform .25s ease;will-change:transform}
  .idcl-card:active,.idcl-card.idcl-dragging{cursor:grabbing}
  .idcl-card.idcl-dragging{transform:scale(1.03)}
  .idcl-card:focus-visible{outline:2px solid var(--idcl-accent);outline-offset:6px;border-radius:18px}
  .idcl-tilt{width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
  .idcl-flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.75,.25,1)}
  .idcl-face{position:absolute;inset:0;border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 32px 60px -16px rgba(0,0,0,.45),0 10px 20px -8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.65),inset 0 0 0 1px rgba(0,0,0,.05)}
  [data-theme="dark"] .idcl-face{box-shadow:0 32px 60px -16px rgba(0,0,0,.8),0 10px 20px -8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.05)}
  .idcl-face::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,transparent 24%),radial-gradient(rgba(0,0,0,.07) 1px,transparent 1.3px) 0 0/3px 3px;mix-blend-mode:multiply;opacity:.6}
  [data-theme="dark"] .idcl-face::before{background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 24%),radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.3px) 0 0/3px 3px;mix-blend-mode:normal;opacity:.7}
  .idcl-face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),transparent 40%);mix-blend-mode:overlay;opacity:0;transition:opacity .3s ease}
  .idcl-card:hover .idcl-face::after{opacity:1}
  .idcl-front{background:linear-gradient(165deg,var(--idcl-card),var(--idcl-card-2));align-items:stretch;text-align:left}
  .idcl-back{background:linear-gradient(165deg,var(--idcl-card-2),var(--idcl-card));transform:rotateY(180deg)}
  .idcl-holo{position:absolute;top:14px;bottom:14px;right:5px;width:6px;border-radius:5px;
    background:repeating-linear-gradient(125deg,#eef1f7 0%,#cfd6e4 10%,#b9c2d6 20%,#e7ebf3 30%,#eef1f7 40%);background-size:220% 220%;animation:idcl-foil 7s linear infinite;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 0 6px rgba(255,255,255,.3)}
  @keyframes idcl-foil{to{background-position:220% 0%}}
  .idcl-off .idcl-holo{animation-play-state:paused}
  .idcl-hole{width:32px;height:9px;background:var(--idcl-card-ink);border-radius:5px;margin:0 auto 10px;flex-shrink:0;opacity:.85}
  .idcl-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
  .idcl-brand{display:flex;align-items:flex-start;gap:6px}
  .idcl-brand-mark{width:13px;height:13px;color:var(--idcl-accent);margin-top:1px;flex-shrink:0}
  .idcl-brand-text{display:flex;flex-direction:column}
  .idcl-brand-text b{font-family:var(--idcl-font-display);font-weight:800;font-size:11.5px;letter-spacing:.01em;color:var(--idcl-card-ink);line-height:1.2}
  .idcl-brand-text small{font-family:var(--idcl-font-mono);font-size:6.3px;letter-spacing:.09em;text-transform:uppercase;color:var(--idcl-card-soft)}
  .idcl-pillars{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .idcl-pillars span{font-family:var(--idcl-font-mono);font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--idcl-card-soft)}
  .idcl-pillars i{width:16px;height:2px;background:var(--idcl-card-ink);margin-top:3px}
  .idcl-photo{position:relative;width:100%;flex:1 1 auto;min-height:120px;max-height:200px;border-radius:10px;background:#eae7de;overflow:hidden;margin-bottom:12px;flex-shrink:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 2px 6px rgba(0,0,0,.12)}
  [data-theme="dark"] .idcl-photo{background:#1c1c20;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 2px 6px rgba(0,0,0,.4)}
  .idcl-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .idcl-namerow{display:flex;align-items:center;gap:7px;margin-bottom:2px}
  .idcl-verified{width:16px;height:16px;border-radius:50%;color:#fff;background:linear-gradient(160deg,var(--idcl-accent),var(--idcl-accent-dim));
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .idcl-verified svg{width:9px;height:9px}
  .idcl-name{margin:0;font-family:var(--idcl-font-display);font-weight:800;font-size:18px;color:var(--idcl-card-ink);letter-spacing:-.01em}
  .idcl-role{margin:0 0 10px;font-size:10px;color:var(--idcl-card-soft);font-weight:600;letter-spacing:.09em;text-transform:uppercase}
  .idcl-divider{width:100%;height:1px;background:var(--idcl-card-line);margin-bottom:10px}
  .idcl-idrow{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
  .idcl-idrow-labels{display:flex;flex-direction:column;gap:5px;font-family:var(--idcl-font-mono)}
  .idcl-idrow-labels div{display:flex;gap:8px;align-items:baseline}
  .idcl-idrow-labels span{width:56px;flex-shrink:0;font-size:7.6px;letter-spacing:.06em;text-transform:uppercase;color:var(--idcl-card-soft)}

/* ---------------- Theme hook ---------------- */
let themeTimer = 0;
function useTheme() {
  const [theme, setTheme] = useState(document.documentElement.getAttribute('data-theme') || 'light');
  const toggle = useCallback(() => {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.classList.add('theme-switch');
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', next === 'dark' ? '#050506' : '#ffffff');
    clearTimeout(themeTimer);
    themeTimer = setTimeout(() => root.classList.remove('theme-switch'), 420);
    setTheme(next);
  }, []);
  return [theme, toggle];
}

    const cells = new Map();

    try { probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true }); } catch (e) {}
    const readTheme = () => {
      if (!probe) return;
      try {
        probe.clearRect(0, 0, 1, 1);
        probe.fillStyle = getComputedStyle(el).color;
        probe.fillRect(0, 0, 1, 1);
        const d = probe.getImageData(0, 0, 1, 1).data;
        const light = (0.2126 * d[0] + 0.7152 * d[1] + 0.0722 * d[2]) / 255 > 0.5;
        tints = light ? GP.TINTS_DARK : GP.TINTS;
      } catch (e) {}
    };

    const measureText = () => {
      const bounds = el.getBoundingClientRect();
      const scope = el.parentElement || document;
      clear = [];
      scope.querySelectorAll(avoid).forEach((node) => {
        const range = document.createRange();
        range.selectNodeContents(node);
        const lines = Array.from(range.getClientRects()).filter(r => r.width > 0 && r.height > 0);
        const boxes = lines.length > 0 ? lines : [node.getBoundingClientRect()];
        boxes.forEach((r) => {
          clear.push(new DOMRect(
            r.left - bounds.left - GP.PAD,
            r.top - bounds.top - GP.PAD,
            r.width + GP.PAD * 2,
            r.height + GP.PAD * 2
          ));
        });
      });
    };

    const measure = () => {
      width = el.clientWidth;
      height = el.clientHeight;
      cols = Math.max(1, Math.ceil(width / cell));
      rows = Math.max(1, Math.ceil(height / cell));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      paper.width = Math.round(width * dpr);
      paper.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      readTheme();
      measureText();
      wake();
    };

    const brightness = (col, row) => {
      const x = col * cell + cell / 2, y = row * cell + cell / 2;
      let nearest = Infinity;
      for (const r of clear) {
        const dx = Math.max(r.left - x, 0, x - r.right);
        const dy = Math.max(r.top - y, 0, y - r.bottom);
        nearest = Math.min(nearest, Math.hypot(dx, dy));
        if (nearest === 0) break;
      }
      if (nearest === Infinity) return 1;
      return GP.FAINT + (1 - GP.FAINT) * Math.min(1, nearest / (GP.FADE * cell));
    };

    const ink = (row) => {
      const t = rows > 1 ? Math.min(1, row / (rows - 1)) : 0;
      const hue = (((GP.HUE_TOP - t * GP.HUE_SPAN) % 360) + 360) % 360;
      const tint = tints[Math.floor(Math.random() * tints.length)];
      return 'hsl(' + Math.round(hue) + ' 94% ' + tint + '%)';
    };

    let frame = 0;
    const draw = (now) => {
      frame = 0;
      ctx.clearRect(0, 0, width, height);
      cells.forEach((c, key) => {
        let alpha;
        if (now < c.until) {
          alpha = gpEaseOut(Math.min(1, (now - c.born) / GP.FADE_IN));
        } else {
          const t = (now - c.until) / GP.FADE_OUT;
          if (t >= 1) { cells.delete(key); return; }
          alpha = 1 - gpEaseIn(t);
        }
        ctx.globalAlpha = alpha * c.dim;
        ctx.fillStyle = c.colour;
        ctx.fillRect(c.col * cell + 1, c.row * cell + 1, cell - 1, cell - 1);
      });
      ctx.globalAlpha = 1;
      if (cells.size > 0) frame = requestAnimationFrame(draw);
    };
    const wake = () => { if (!frame) frame = requestAnimationFrame(draw); };

    const light = (col, row, hold) => {
      if (col < 0 || row < 0 || col >= cols || row >= rows) return;
      if (cells.size >= maxLit) return;
      const key = col + ',' + row;
      const now = performance.now();
      const lit = cells.get(key);
      if (lit && now < lit.until) return;
      let born = now;
      if (lit) {
        const faded = 1 - gpEaseIn(Math.min(1, Math.max(0, (now - lit.until) / GP.FADE_OUT)));
        born = now - (1 - Math.sqrt(1 - faded)) * GP.FADE_IN;
      }
      cells.set(key, {
        col, row,
        colour: lit ? lit.colour : ink(row),
        dim: brightness(col, row),
        born,
        until: now + hold
      });
      wake();
    };

    let pending = 0;
    let at = null;
    const paint = () => {
      pending = 0;
      if (!at) return;
      const cx = Math.floor(at.x / cell), cy = Math.floor(at.y / cell);
      const span = Math.ceil(reach);
      for (let dy = -span; dy <= span; dy++) {
        for (let dx = -span; dx <= span; dx++) {
          const away = Math.hypot(dx, dy);
          if (away > reach) continue;
          if (Math.random() > 1 - away / (reach + 0.6)) continue;
          light(cx + dx, cy + dy, 260 + Math.random() * 900);
        }
      }
    };
    const onMove = (event) => {
      const bounds = el.getBoundingClientRect();
      at = { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
      if (!pending) pending = requestAnimationFrame(paint);
    };

    let visible = true;
    let beat = 0;
    const drift = () => {
      beat = window.setTimeout(drift, 1400 + Math.random() * 1800);
      if (!visible || document.hidden) return;
      for (let i = 0; i < ambient; i++) {
        light(Math.floor(Math.random() * cols), Math.floor(Math.random() * rows), 900 + Math.random() * 1600);
      }
    };
    beat = window.setTimeout(drift, 500);

    const sight = new IntersectionObserver((entries) => {
      visible = entries[0] ? entries[0].isIntersecting : true;
    });
    sight.observe(el);
    const resize = new ResizeObserver(measure);
    resize.observe(el);

    let recheck = 0;
    const copy = new MutationObserver(() => {
      if (recheck) return;
      recheck = window.setTimeout(() => { recheck = 0; measureText(); }, 150);
    });
    copy.observe(el.parentElement || document.body, {
      childList: true, subtree: true, characterData: true
    });
    const theme = new MutationObserver(readTheme);
    theme.observe(document.documentElement, {
      attributes: true, attributeFilter: ['class', 'style', 'data-theme']
    });
    const scheme = window.matchMedia('(prefers-color-scheme: dark)');
    const onScheme = () => readTheme();
    if (scheme.addEventListener) scheme.addEventListener('change', onScheme);

    measure();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureText).catch(() => {});
    window.addEventListener('pointermove', onMove, { passive: true });

    return () => {
      sight.disconnect();
      resize.disconnect();
      copy.disconnect();
      if (recheck) { clearTimeout(recheck); recheck = 0; }
      theme.disconnect();
      if (scheme.removeEventListener) scheme.removeEventListener('change', onScheme);
      if (frame) cancelAnimationFrame(frame);
      if (pending) cancelAnimationFrame(pending);
      clearTimeout(beat);
      window.removeEventListener('pointermove', onMove);
    };
  }, []);

  return html`
    <div ref=${boxRef} aria-hidden="true" class="gp" style=${'--gp-cell:' + cell + 'px'}>
      <canvas ref=${canvasRef}></canvas>
    </div>`;
}

/* ---------------- TextRotate ---------------- */
function TextRotate({ texts, rotationInterval = 3000, staggerDuration = 0.03 }) {
  const [index, setIndex] = useState(0);
  const [out, setOut] = useState(false);

  useEffect(() => {
    if (texts.length < 2) return;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let t2;
    const id = setInterval(() => {
      setOut(true);
      t2 = setTimeout(() => {
        setIndex(i => (i + 1) % texts.length);
        setOut(false);
      }, 780);
    }, rotationInterval);
    return () => { clearInterval(id); clearTimeout(t2); };
  }, [texts, rotationInterval]);

  const text = texts[index] || '';
  const words = text.split(' ');
  const total = text.replace(/ /g, '').length;
  let gi = 0;

  return html`
    <span class="tr">
      <span class=${'tr-viewport' + (out ? ' tr-out' : '')} key=${index} aria-hidden="true">
        ${words.map((word, wi) => html`
          <span class="tr-word" key=${wi}>
            ${Array.from(word).map((ch, ci) => {
              const i = gi++;
              const d = ((total - 1 - i) * staggerDuration).toFixed(3);
              return html`<span class="tr-char" style=${'--d:' + d + 's'} key=${ci}>${ch}</span>`;
            })}
            ${wi < words.length - 1 && html`<span class="tr-sp"> </span>`}
          </span>`)}
      </span>
      <span class="sr-only">${text}</span>
    </span>`;
}

/* ---------------- Parallax Floating (searah kursor) ---------------- */
function ParallaxFloating() {
  const wrapRef = useRef(null);
  useEffect(() => {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const wrap = wrapRef.current;
    if (!wrap) return;

    const FOLLOW = 0.045;
    const EASE = 0.06;
    const els = Array.from(wrap.querySelectorAll('.fl')).map(el => ({
      el, depth: parseFloat(el.dataset.depth || '1'), x: 0, y: 0
    }));

    let rect = wrap.getBoundingClientRect();
    const updRect = () => { rect = wrap.getBoundingClientRect(); };
    window.addEventListener('scroll', updRect, { passive: true });
    window.addEventListener('resize', updRect, { passive: true });

    const cur = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    const onMove = (x, y) => { cur.x = x; cur.y = y; };
    const mm = (e) => onMove(e.clientX, e.clientY);
    const tm = (e) => { if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY); };
    window.addEventListener('mousemove', mm, { passive: true });
    window.addEventListener('touchmove', tm, { passive: true });

    let visible = true, raf = 0;
    const tick = () => {
      raf = 0;
      if (!visible || document.hidden) return;
      const cx = cur.x - (rect.left + rect.width / 2);
      const cy = cur.y - (rect.top + rect.height / 2);
      for (const s of els) {
        const k = s.depth * FOLLOW;
        s.x += (cx * k - s.x) * EASE;
        s.y += (cy * k - s.y) * EASE;
        s.el.style.transform = 'translate3d(' + s.x.toFixed(2) + 'px,' + s.y.toFixed(2) + 'px,0)';
      }
      raf = requestAnimationFrame(tick);
    };
    const start = () => { if (!raf) raf = requestAnimationFrame(tick); };

    const io = new IntersectionObserver((entries) => {
      visible = entries[0].isIntersecting;
      if (visible) { updRect(); start(); }
    }, { rootMargin: '80px' });
    io.observe(wrap);
    const onVis = () => { if (!document.hidden && visible) start(); };
    document.addEventListener('visibilitychange', onVis);
    start();

    return () => {
      if (raf) cancelAnimationFrame(raf);
      io.disconnect();
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('touchmove', tm);
      window.removeEventListener('scroll', updRect);
      window.removeEventListener('resize', updRect);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);

  return html`
    <div class="fl-wrap" ref=${wrapRef} aria-hidden="true">
      ${FLOATERS.map((f, i) => html`
        <div class=${'fl ' + f.cls} data-depth=${f.depth} key=${i}>
          <div class="fl-in fl-r"><img src=${f.src} alt="" loading="lazy" decoding="async" /></div>
        </div>`)}
    </div>`;
}

/* ---------------- Coverflow Carousel (galeri beranda) ---------------- */
function CoverflowCarousel({
  slides, rotate = 44, depth = 0.6, perspective = 3, falloff = 0.56, fade = 0.1,
  cardWidth = 'clamp(148px, 22vw, 260px)', gap = 0.05, loop = true,
  showCaption = true, showPagination = true, showNavigation = true, label = 'Cover carousel'
}) {
  const count = slides.length;
  const frameRef = useRef(null);
  const cardRefs = useRef([]);
  const posRef = useRef(0);
  const targetRef = useRef(0);
  const widthRef = useRef(0);
  const rafRef = useRef(null);
  const dragRef = useRef(null);
  const [selected, setSelected] = useState(0);

  const indexAt = useCallback((pos) => ((Math.round(pos) % count) + count) % count, [count]);

  const paint = useCallback(() => {
    const width = widthRef.current;
    if (!width) return;
    const pitch = width * (1 + gap);
    const pos = posRef.current;
    cardRefs.current.forEach((card, index) => {
      if (!card) return;
      let offset = index - pos;
      if (loop) {
        offset = ((offset % count) + count) % count;
        if (offset > count / 2) offset -= count;
      }
      const distance = Math.abs(offset);
      const ramp = Math.pow(distance, falloff);
      const tilt = Math.min(rotate * ramp, 82) * Math.sign(offset);
      card.style.transform =
        'translateX(calc(-50% + ' + (offset * pitch) + 'px)) ' +
        'translateZ(' + (-depth * width * ramp) + 'px) rotateY(' + (-tilt) + 'deg)';
      const edge = loop ? Math.min(1, Math.max(0, count / 2 - distance)) : 1;
      card.style.opacity = String(Math.max(0, 1 - fade * distance) * edge);
      card.style.zIndex = String(100 - Math.round(distance));
    });
  }, [count, depth, fade, falloff, gap, loop, rotate]);

  const settle = useCallback((target) => {
    if (rafRef.current !== null) cancelAnimationFrame(rafRef.current);
    targetRef.current = target;
    setSelected(indexAt(target));
    const step = () => {
      const remaining = target - posRef.current;
      if (Math.abs(remaining) < 0.0004) {
        posRef.current = target; paint(); rafRef.current = null; return;
      }
      posRef.current += remaining * 0.16;
      paint();
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
  }, [indexAt, paint]);

  const clamp = useCallback((pos) => (loop ? pos : Math.max(0, Math.min(count - 1, pos))), [count, loop]);
  const goTo = useCallback((index) => {
    const target = loop ? index + Math.round((targetRef.current - index) / count) * count : index;
    settle(clamp(target));
  }, [clamp, count, loop, settle]);
  const nudge = useCallback((by) => settle(clamp(Math.round(targetRef.current) + by)), [clamp, settle]);

  const onPointerDown = (event) => {
    if (rafRef.current !== null) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
    event.currentTarget.setPointerCapture(event.pointerId);
    targetRef.current = posRef.current;
    dragRef.current = { id: event.pointerId, x: event.clientX, pos: posRef.current, v: 0, t: performance.now() };
  };
  const onPointerMove = (event) => {
    const drag = dragRef.current;
    if (!drag || drag.id !== event.pointerId) return;
    const pitch = widthRef.current * (1 + gap);
    if (!pitch) return;
    const now = performance.now();
    const previous = posRef.current;
    posRef.current = clamp(drag.pos - (event.clientX - drag.x) / pitch);
    drag.v = ((posRef.current - previous) / Math.max(now - drag.t, 1)) * 1000;
    drag.t = now;
    const index = indexAt(posRef.current);
    if (index !== selected) setSelected(index);
    paint();
  };
  const endDrag = (event) => {
    const drag = dragRef.current;
    if (!drag || drag.id !== event.pointerId) return;
    dragRef.current = null;
    const carried = Math.max(-2, Math.min(2, drag.v * 0.18));
    settle(clamp(Math.round(posRef.current + carried)));
  };

  useEffect(() => {
    const frame = frameRef.current;
    if (!frame) return;
    const measure = () => {
      const card = cardRefs.current[0];
      if (!card) return;
      widthRef.current = card.offsetWidth;
      paint();
    };
    measure();
    const observer = new ResizeObserver(measure);
    observer.observe(frame);
    return () => observer.disconnect();
  }, [paint]);

  useEffect(() => () => { if (rafRef.current !== null) cancelAnimationFrame(rafRef.current); }, []);

  const active = slides[selected];

  return html`
    <div style=${'--cf-card:' + cardWidth} role="region" aria-roledescription="carousel" aria-label=${label}>
      <div style="position:relative">
        <div ref=${frameRef} class="cf-frame" tabIndex="0"
          onPointerDown=${onPointerDown} onPointerMove=${onPointerMove}
          onPointerUp=${endDrag} onPointerCancel=${endDrag}
          onKeyDown=${(event) => {
            if (event.key === 'ArrowLeft') { event.preventDefault(); nudge(-1); }
            else if (event.key === 'ArrowRight') { event.preventDefault(); nudge(1); }
          }}
          style=${'perspective:calc(var(--cf-card) * ' + perspective + ')'}>
          <div class="cf-inner">
            ${slides.map((slide, index) => html`
              <div key=${index} ref=${(node) => { cardRefs.current[index] = node; }}
                role="group" aria-roledescription="slide" aria-label=${(index+1) + ' dari ' + count}
                class="cf-card">
                <img src=${slide.src} alt=${slide.alt} draggable="false"
                  loading=${index === 0 ? 'eager' : 'lazy'} decoding="async" />
              </div>`)}
          </div>
        </div>
        ${showNavigation && html`
          <button type="button" aria-label="Slide sebelumnya" class="cf-nav left" onClick=${() => nudge(-1)}><${ChevronLeft}/></button>
          <button type="button" aria-label="Slide berikutnya" class="cf-nav right" onClick=${() => nudge(1)}><${ChevronRight}/></button>`}
      </div>
      ${showCaption && active && active.title && html`
        <div key=${selected} class="anim-fade center" style="margin-top:8px">
          <p style="margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em">${active.title}</p>
          ${active.subtitle && html`<p style="margin:4px 0 0;font-size:13px;color:var(--muted)">${active.subtitle}</p>`}
        </div>`}
      ${showPagination && html`
        <div style="margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px">
          ${slides.map((_, index) => html`
            <button key=${index} type="button" aria-label=${'Ke slide ' + (index+1)}
              aria-current=${index === selected} onClick=${() => goTo(index)}
              class="cf-dot" style=${'opacity:' + (index === selected ? 1 : 0.3)} />`)}
        </div>`}
    </div>`;
}
